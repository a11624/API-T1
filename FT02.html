<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resoluçao da ficha 02</title>
    <style>
        body{
            background-color:#f2f2f2    
        }
        ul{ 
            background-color: lightblue;
        }
        ol{
            background-color: rgb(255, 236, 179);
        }
    </style>
</head>
<body>
    <h1>Listas</h1>
    <hr color="grey">
    <h2>Listas nao numeradas</h2>
    <ul style="list-style-type: circle">
        <li> Faculdade de Engenharia</li>
        <ul style="list-style-type: square">
            <li>Departamento</li>
                <ul style="list-style-type: disc">
                    <li>DECQ</li>
                    <li>DEC</li>
                    <li>DECC</li>
                    <li>...</li>
                </ul>
            <li>Seviços</li>
                 <ul style="list-style-type: disc">
                    <li>CICA</li>
                    <li>Biblioteca</li>
                    <li>...</li>
                </ul>
        </ul>
        <li> Faculdade de Mdecicina</li>
    </ul>
        <hr color="grey">
        <h2>Listas Numeradas</h2>
        <ol type="A">
            <li>Escola da Luz</li>
            <li>Escola da Paz</li>
        </ol>

    
</body>
</html>
