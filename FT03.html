<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube de Informática</title>
    <style>
        h1{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 28px ;
            color: blue;
            font-style: bold;
            text-align: center;
        }
        td,th{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 14px;
            border: solid red 1px;
            width: 150px;
        }
        caption{
            text-align: center;
        }
        body{
            background-color: #F0F5FA;
        }
        table{
            border: solid red 3px;
            border-collapse: collapse;
        }
        th{
            background-color: rosybrown;
        }
    </style>
</head>
<body>
    <h1>Clube de Informática</h1>
    <table align="center">
    <tr>
    <caption align="center">Horario semanal de atividades-2026/2027</caption>
    <tr>
        <th>Hora</th>
        <th>Segunda</th>
        <th>Terça</th>
        <th>Quarta</th>
        <th>Quinta</th>
    </table>
</body>
</html>
